[project]
name = "zam-hesap-mcp"
version = "0.6.0"
description = "Türkiye maaş, asgari ücret, emekli/memur zammı, kıdem-ihbar ve izin hesapları için MCP sunucusu"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "pyyaml>=6"]
keywords = ["mcp", "claude", "turkiye", "maas", "emekli", "asgari-ucret", "bordro", "kidem-tazminati", "memur"]

[project.scripts]
zam-hesap-mcp = "zam_hesap.server:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zam_hesap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
